name: CI

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, identity-service, promotion-service, notification-service, form-service, gateway-service, file-service, dashboard-service, mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js (for mobile)
        if: matrix.service == 'mobile'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Build and test ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "mobile" ]; then
            cd mobile
            npm ci
            npm run test
          else
            ./gradlew :services:circleguard-${{ matrix.service }}:test
          fi

      - name: Generate JaCoCo report
        if: matrix.service != 'mobile'
        run: ./gradlew :services:circleguard-${{ matrix.service }}:jacocoTestReport

      - name: Upload JaCoCo coverage report
        if: matrix.service != 'mobile'
        uses: codecov/codecov-action@v4
        with:
          files: services/circleguard-${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Start infrastructure
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 60

      - name: Run cross-service integration tests
        run: ./gradlew :tests:integration-tests:test --no-daemon

      - name: Generate coverage report for all services
        run: ./gradlew jacocoTestReport

      - name: Upload aggregated coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          flags: integration-tests
          fail_ci_if_error: false

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  e2e-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start infrastructure
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec circleguard-postgres pg_isready -U admin -d circleguard && break
            echo "Waiting for postgres... ($i/30)"
            sleep 3
          done

      - name: Start core services
        run: bash scripts/ci-start-services.sh

      - name: Run Cypress E2E tests
        working-directory: tests/e2e/cypress
        run: |
          npm install
          npx cypress run

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/e2e/cypress/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop services and infrastructure
        if: always()
        run: |
          [ -f /tmp/cg-pids ] && xargs -r kill < /tmp/cg-pids 2>/dev/null || true
          docker compose -f docker-compose.dev.yml down

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon

      - name: Upload Dependency Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check/
          retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust==2.24.0

      - name: Start infrastructure
        run: docker compose -f docker-compose.dev.yml up -d postgres openldap

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec circleguard-postgres pg_isready -U admin -d circleguard && break
            echo "Waiting for postgres... ($i/30)"
            sleep 3
          done

      - name: Build auth-service and dashboard-service JARs
        run: |
          ./gradlew :services:circleguard-auth-service:bootJar \
                    :services:circleguard-dashboard-service:bootJar \
                    --no-daemon

      - name: Start auth-service
        run: |
          java -jar services/circleguard-auth-service/build/libs/*.jar \
            --server.port=8180 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/circleguard_auth \
            --spring.datasource.username=admin \
            --spring.datasource.password=password \
            --jwt.secret=my-super-secret-ci-key-32-chars-long!! \
            --spring.ldap.urls=ldap://localhost:389 > /tmp/auth.log 2>&1 &
          echo $! > /tmp/auth.pid

      - name: Wait for auth-service
        run: |
          for i in $(seq 1 40); do
            if curl -sf -X POST http://localhost:8180/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"health_user","password":"password"}' \
              -o /dev/null; then
              echo "auth-service ready"
              break
            fi
            echo "Waiting for auth-service... ($i/40)"
            sleep 3
          done

      - name: Run Locust performance test (headless, 60s)
        run: |
          locust -f tests/performance/locustfile.py \
            --host=http://localhost:8180 \
            --headless \
            --users 20 \
            --spawn-rate 5 \
            --run-time 60s \
            --csv=/tmp/locust-results \
            --exit-code-on-error 1
        env:
          AUTH_HOST: http://localhost:8180
          DASHBOARD_HOST: http://localhost:8084
          GATEWAY_HOST: http://localhost:8087
          FORM_HOST: http://localhost:8086

      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: /tmp/locust-results*.csv
          retention-days: 30

      - name: Stop services and infrastructure
        if: always()
        run: |
          kill $(cat /tmp/auth.pid) 2>/dev/null || true
          docker compose -f docker-compose.dev.yml down

  security-scan:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Start infrastructure
        run: docker compose -f docker-compose.dev.yml up -d postgres openldap

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec circleguard-postgres pg_isready -U admin -d circleguard && break
            echo "Waiting for postgres... ($i/30)"
            sleep 3
          done

      - name: Build auth-service JAR
        run: ./gradlew :services:circleguard-auth-service:bootJar --no-daemon

      - name: Start auth-service
        run: |
          java -jar services/circleguard-auth-service/build/libs/*.jar \
            --server.port=8180 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/circleguard_auth \
            --spring.datasource.username=admin \
            --spring.datasource.password=password \
            --jwt.secret=my-super-secret-ci-key-32-chars-long!! \
            --spring.ldap.urls=ldap://localhost:389 > /tmp/auth-zap.log 2>&1 &
          echo $! > /tmp/auth-zap.pid

      - name: Wait for auth-service
        run: |
          for i in $(seq 1 40); do
            if curl -sf -X POST http://localhost:8180/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"health_user","password":"password"}' \
              -o /dev/null; then
              echo "auth-service ready for ZAP scan"
              break
            fi
            echo "Waiting for auth-service... ($i/40)"
            sleep 3
          done

      - name: Create ZAP rules file
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10202	IGNORE	(Private IP Disclosure)
          10027	IGNORE	(Information Disclosure - Suspicious Comments)
          EOF

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8180'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I -j'
          artifact_name: 'zap-baseline-report'
          issue_title: 'ZAP Baseline Scan - CircleGuard Auth Service'
        continue-on-error: true

      - name: Stop auth-service and infrastructure
        if: always()
        run: |
          kill $(cat /tmp/auth-zap.pid) 2>/dev/null || true
          docker compose -f docker-compose.dev.yml down

  quality-check:
    runs-on: ubuntu-latest
    needs: [build, integration-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Verify JaCoCo coverage for all services
        run: ./gradlew jacocoTestCoverageVerification

  sonarqube:
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon

      - name: SonarQube skipped notice
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN not set — skipping SonarQube analysis."

  docker-build-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, identity-service, promotion-service, notification-service, form-service, file-service, gateway-service, dashboard-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/circleguard-${{ matrix.service }}/Dockerfile
          tags: juanamor8/circleguard-${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: juanamor8/circleguard-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: juanamor8/circleguard-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  release:
    runs-on: ubuntu-latest
    needs: [build, integration-test, quality-check, sonarqube, docker-build-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@23 \
            -p @semantic-release/git@10 \
            -p @semantic-release/changelog@6 \
            semantic-release

  deploy-prod:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://circleguard.example.com
    env:
      REGISTRY_USER: juanamor8
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_URL: ${{ secrets.PROD_DB_URL }}
      DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      QR_SECRET: ${{ secrets.PROD_QR_SECRET }}
      LDAP_URL: ${{ secrets.PROD_LDAP_URL }}
      LDAP_BIND_DN: ${{ secrets.PROD_LDAP_BIND_DN }}
      LDAP_BIND_PASSWORD: ${{ secrets.PROD_LDAP_BIND_PASSWORD }}
      NEO4J_USERNAME: ${{ secrets.PROD_NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
      VAULT_SECRET: ${{ secrets.PROD_VAULT_SECRET }}
      VAULT_SALT: ${{ secrets.PROD_VAULT_SALT }}
      VAULT_HASH_SALT: ${{ secrets.PROD_VAULT_HASH_SALT }}
      TWILIO_ACCOUNT_SID: ${{ secrets.PROD_TWILIO_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.PROD_TWILIO_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.PROD_TWILIO_FROM }}
      GOTIFY_TOKEN: ${{ secrets.PROD_GOTIFY_TOKEN }}
      CORS_ORIGINS: ${{ vars.PROD_CORS_ORIGINS || 'https://circleguard.example.com' }}
      MAIL_HOST: ${{ vars.PROD_MAIL_HOST || 'smtp.circleguard.edu' }}
      MAIL_PORT: ${{ vars.PROD_MAIL_PORT || '587' }}
      FILE_UPLOAD_DIR: ${{ vars.PROD_FILE_UPLOAD_DIR || 'uploads' }}
      ENCOUNTER_WINDOW_DAYS: '14'
      MANDATORY_FENCE_DAYS: '14'
      AUTO_THRESHOLD_SECONDS: '3600'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: JuanAmor8/circleguard-infra
          path: infra

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Check registry credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN not set — building release images without pushing."
          fi

      - name: Login to Docker Hub
        if: steps.creds.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release images
        run: |
          for svc in auth identity gateway form notification promotion dashboard file; do
            docker build -f services/circleguard-${svc}-service/Dockerfile \
              -t ${REGISTRY_USER}/circleguard-${svc}-service:${{ steps.version.outputs.version }} \
              -t ${REGISTRY_USER}/circleguard-${svc}-service:latest .
            if [ "${{ steps.creds.outputs.push }}" = "true" ]; then
              docker push ${REGISTRY_USER}/circleguard-${svc}-service:${{ steps.version.outputs.version }}
              docker push ${REGISTRY_USER}/circleguard-${svc}-service:latest
            fi
          done

      - name: Configure kubeconfig
        id: kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PROD }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_PROD secret not set — skipping cluster deploy (images published)."
          else
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to production cluster
        if: steps.kubeconfig.outputs.available == 'true'
        run: |
          kubectl apply -f infra/k8s/namespaces/
          envsubst < infra/k8s/master/configmaps.yaml | kubectl apply -f -
          envsubst < infra/k8s/master/secrets.yaml | kubectl apply -f -
          kubectl apply -f infra/k8s/master/
          for svc in auth identity gateway form notification promotion dashboard file; do
            kubectl set image deployment/${svc}-service \
              ${svc}-service=${REGISTRY_USER}/circleguard-${svc}-service:${{ steps.version.outputs.version }} \
              -n circleguard-master || true
            kubectl annotate deployment/${svc}-service \
              kubernetes.io/change-cause="Release ${{ steps.version.outputs.version }}" \
              --overwrite -n circleguard-master || true
          done
          for svc in auth identity gateway form notification promotion dashboard file; do
            kubectl rollout status deployment/${svc}-service -n circleguard-master --timeout=300s || true
          done

      - name: Smoke test
        if: steps.kubeconfig.outputs.available == 'true'
        run: |
          kubectl get pods -n circleguard-master
          kubectl port-forward svc/gateway-service 8087:8087 -n circleguard-master &
          sleep 10
          curl -sf http://localhost:8087/actuator/health || echo "::warning::gateway health check failed"

  # Notificación automática de fallos (rúbrica CI/CD): si cualquier job clave
  # falla, se abre/actualiza un issue con el enlace al run. No requiere
  # secretos externos; si se configura SLACK_WEBHOOK_URL, también notifica ahí.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [build, integration-test, dependency-check, security-scan, quality-check, sonarqube, docker-build-scan]
    if: failure()
    permissions:
      issues: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Open issue with failure details
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI failure on ${context.ref.replace('refs/heads/','')} (${context.sha.substring(0,7)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['ci-failure'],
              body: `El pipeline de CI falló.\n\n- **Run**: ${runUrl}\n- **Commit**: ${context.sha}\n- **Autor**: @${context.actor}\n\nRevisar los jobs en rojo y aplicar el plan de rollback si el fallo llegó a un ambiente (docs/CHANGE_MANAGEMENT.md).`
            });

      - name: Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ CI falló en ${{ github.ref_name }} (${{ github.sha }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
