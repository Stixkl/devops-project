apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: circleguard-stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: juanamor8/circleguard-file-service:stage-${BUILD_NUMBER}
        ports:
        - containerPort: 8085
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 60
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: circleguard-stage
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
  selector:
    app: file-service
