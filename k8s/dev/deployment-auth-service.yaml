apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: circleguard-dev
  labels:
    app: auth-service
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        environment: dev
    spec:
      containers:
      - name: auth-service
        image: juanamor8/circleguard-auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8180
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/circleguard_auth"
        - name: SPRING_DATASOURCE_USERNAME
          value: "admin"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "password"
        - name: SPRING_LDAP_URLS
          value: "ldap://host.docker.internal:389"
        - name: SPRING_LDAP_USERNAME
          value: "cn=admin,dc=circleguard,dc=edu"
        - name: SPRING_LDAP_PASSWORD
          value: "admin"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8180
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8180
          initialDelaySeconds: 30
          periodSeconds: 5