apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: circleguard-master
  annotations:
    kubernetes.io/change-cause: "Release ${RELEASE_VERSION}"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      containers:
      - name: promotion-service
        image: circleguard/promotion-service:${RELEASE_VERSION}
        ports:
        - containerPort: 8088
        env:
        - name: SPRING_NEO4J_URI
          value: "bolt://neo4j-prod:7687"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-prod:9092"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis-prod"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 90
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: circleguard-master
spec:
  type: ClusterIP
  ports:
  - port: 8088
    targetPort: 8088
  selector:
    app: promotion-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: promotion-service-hpa
  namespace: circleguard-master
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: promotion-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70