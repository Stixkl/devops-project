resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 4s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      promotionService:
        base-config: default
        sliding-window-size: 20
        minimum-number-of-calls: 10

circleguard:
  client:
    promotion-service:
      url: ${CIRCLEGUARD_CLIENT_PROMOTION_URL:http://localhost:8088}
      connect-timeout: ${CIRCLEGUARD_CLIENT_PROMOTION_CONNECT_TIMEOUT:2000}
      read-timeout: ${CIRCLEGUARD_CLIENT_PROMOTION_READ_TIMEOUT:5000}
      write-timeout: ${CIRCLEGUARD_CLIENT_PROMOTION_WRITE_TIMEOUT:3000}

logging:
  level:
    com.circleguard: ${LOGGING_LEVEL_CIRCLEGUARD:INFO}
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers${MANAGEMENT_ENDPOINTS_EXTRA:}
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
      environment: ${ENVIRONMENT:development}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    db:
      enabled: true
    circuitbreakers:
      enabled: ${CIRCUITBREAKERS_HEALTH_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.01}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://jaeger-collector:9411}/api/v2/spans
  observations:
    http:
      server:
        exclude-patterns: /actuator/health/**,/actuator/health

spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_dashboard}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8084}
