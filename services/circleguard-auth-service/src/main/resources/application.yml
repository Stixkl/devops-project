resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 4s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      identityService:
        base-config: default
        wait-duration-in-open-state: 15s
        failure-rate-threshold: 40

circleguard:
  client:
    identity-service:
      url: ${CIRCLEGUARD_CLIENT_IDENTITY_URL:http://localhost:8083}
      connect-timeout: ${CIRCLEGUARD_CLIENT_IDENTITY_CONNECT_TIMEOUT:2000}
      read-timeout: ${CIRCLEGUARD_CLIENT_IDENTITY_READ_TIMEOUT:3000}
      write-timeout: ${CIRCLEGUARD_CLIENT_IDENTITY_WRITE_TIMEOUT:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_auth}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE_DN:dc=circleguard,dc=edu}
    username: ${LDAP_BIND_DN:cn=admin,dc=circleguard,dc=edu}
    password: ${LDAP_BIND_PASSWORD:admin}

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}
  expiration: ${JWT_EXPIRATION_MS:3600000}

qr:
  secret: ${QR_SECRET:my-qr-secret-key-for-dev-1234567890}
  expiration: ${QR_EXPIRATION_SECONDS:300}

server:
  port: ${SERVER_PORT:8180}
