spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_promotion}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      observation-enabled: true
    listener:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

encounter:
  window-days: ${ENCOUNTER_WINDOW_DAYS:14}
  mandatory-fence-days: ${MANDATORY_FENCE_DAYS:14}

auto:
  threshold-seconds: ${AUTO_THRESHOLD_SECONDS:3600}

server:
  port: ${SERVER_PORT:8088}

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}
  expiration: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.circleguard: ${LOGGING_LEVEL_CIRCLEGUARD:INFO}
    org.springframework: WARN
    org.apache.kafka: WARN
    org.neo4j: WARN
    org.hibernate: WARN
    io.lettuce.core: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus${MANAGEMENT_ENDPOINTS_EXTRA:}
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
      environment: ${ENVIRONMENT:development}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    db:
      enabled: true
    neo4j:
      enabled: ${NEO4J_HEALTH_ENABLED:false}
    kafka:
      enabled: ${KAFKA_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.01}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://jaeger-collector:9411}/api/v2/spans
  observations:
    http:
      server:
        exclude-patterns: /actuator/health/**,/actuator/health
