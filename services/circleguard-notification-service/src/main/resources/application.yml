resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 4s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      authServicePermissions:
        base-config: default
        wait-duration-in-open-state: 30s

circleguard:
  client:
    auth-service:
      url: ${CIRCLEGUARD_CLIENT_AUTH_URL:http://localhost:8180}
      connect-timeout: ${CIRCLEGUARD_CLIENT_AUTH_CONNECT_TIMEOUT:2000}
      read-timeout: ${CIRCLEGUARD_CLIENT_AUTH_READ_TIMEOUT:3000}
      write-timeout: ${CIRCLEGUARD_CLIENT_AUTH_WRITE_TIMEOUT:3000}

logging:
  level:
    com.circleguard: ${LOGGING_LEVEL_CIRCLEGUARD:INFO}
    org.springframework: WARN
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers${MANAGEMENT_ENDPOINTS_EXTRA:}
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
      environment: ${ENVIRONMENT:development}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    kafka:
      enabled: ${KAFKA_HEALTH_ENABLED:false}
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    circuitbreakers:
      enabled: ${CIRCUITBREAKERS_HEALTH_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.01}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://jaeger-collector:9411}/api/v2/spans
  observations:
    http:
      server:
        exclude-patterns: /actuator/health/**,/actuator/health

spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}
  expiration: ${JWT_EXPIRATION_MS:3600000}

qr:
  secret: ${QR_SECRET:my-qr-secret-key-for-dev-1234567890}
  expiration: ${QR_EXPIRATION_SECONDS:300}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC_MOCK_SID}
  auth-token: ${TWILIO_AUTH_TOKEN:mock-token}
  from-number: ${TWILIO_FROM_NUMBER:+15550000000}

push:
  gotify:
    url: ${GOTIFY_URL:http://localhost:8080}
    token: ${GOTIFY_TOKEN:mock-token}

room:
  booking:
    api:
      url: ${ROOM_BOOKING_API_URL:https://facilities.university.edu/api/v1/rooms}

lms:
  api:
    url: ${LMS_API_URL:https://lms.university.edu/api/v1}

identity:
  api:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}

notification:
  url:
    testing: ${NOTIFICATION_URL_TESTING:https://circleguard.example.com/testing}
    isolation: ${NOTIFICATION_URL_ISOLATION:https://circleguard.example.com/isolation}

server:
  port: ${SERVER_PORT:8082}
