spring:
  application:
    name: circleguard-identity-service
  kafka:
    producer:
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_identity}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  secret: ${VAULT_SECRET:746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536}
  salt: ${VAULT_SALT:deadbeef}
  hash-salt: ${VAULT_HASH_SALT:12345678}

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}

logging:
  level:
    com.circleguard: ${LOGGING_LEVEL_CIRCLEGUARD:INFO}
    org.springframework: WARN
    org.apache.kafka: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus${MANAGEMENT_ENDPOINTS_EXTRA:}
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
      environment: ${ENVIRONMENT:development}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    db:
      enabled: true
    kafka:
      enabled: ${KAFKA_HEALTH_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.01}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://jaeger-collector:9411}/api/v2/spans
  observations:
    http:
      server:
        exclude-patterns: /actuator/health/**,/actuator/health

server:
  port: ${SERVER_PORT:8083}
